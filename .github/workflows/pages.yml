# Build, test, and publish CLATTER (static Vite + LXR WebAssembly) to GitHub Pages.
# The public site is https://ovelhaaa.github.io/clatter/ (no custom domain).
name: Build and deploy CLATTER

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM WebAssembly toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld
          clang --version
          wasm-ld --version

      - name: Install dependencies
        run: npm ci

      # Rebuild the LXR engine from the versioned C sources (not from a downloaded binary).
      - name: Build LXR WebAssembly
        run: |
          npm run build:lxr
          if ! git diff --quiet -- src/audio/lxr/lxr.wasm; then
            echo "::warning::LXR WebAssembly differs from the committed binary; publishing the freshly rebuilt version."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build static site
        run: npx vite build

      - name: Verify deploy assets
        run: |
          test -f dist/index.html
          test -f dist/samples/index.json
          test -f dist/LICENSE.txt
          test -f dist/NOTICE.md
          test ! -e dist/CNAME
          find dist -type f -name '*.wasm' | grep -q .

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end browser tests
        run: npm run test:e2e

      # Never upload or publish an untested PR artifact.
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
